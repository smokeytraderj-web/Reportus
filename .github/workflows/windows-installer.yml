name: Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out Reporticles
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build and verify installer
        shell: powershell
        run: .\scripts\build_windows.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: Reporticles-Windows-Installer
          path: |
            dist/installer/Reporticles-Setup-*.exe
            dist/installer/Reporticles-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 14
